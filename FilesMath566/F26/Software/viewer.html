<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>View source</title></head>
<body>
<pre id="code">Loading…</pre>
<script>
  const f = new URLSearchParams(location.search).get('f');
  fetch(f).then(r => r.text())
    .then(t => { document.getElementById('code').textContent = t; })
    .catch(e => { document.getElementById('code').textContent = 'Error: ' + e; });
</script>
</body>
</html>
